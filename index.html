<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      NPR News Station Map: find your closest NPR News member station.
      SPDX-License-Identifier: GPL-3.0-or-later
      Data: NPR member directory, FCC licensed transmitter data,
      Open-Meteo geocoding. Basemap (c) OpenFreeMap & OpenStreetMap.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>Find Your Closest NPR News Station: Interactive Coverage Map</title>
    <meta
      name="description"
      content="Free interactive map of 900+ NPR News member radio stations across the US. Click anywhere or use your location to find the nearest NPR News station you can tune into, with FM broadcast coverage estimated from FCC transmitter data. Music-only services excluded."
    />
    <meta
      name="keywords"
      content="NPR station finder, NPR News, public radio, FM radio map, radio station coverage, local NPR station, member stations, broadcast contour"
    />
    <meta name="author" content="NPR Station Map" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />
    <!--
      Replace with your production URL before deploying (also update
      public/sitemap.xml and public/robots.txt).
    -->
    <link rel="canonical" href="https://nprmap.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NPR News Station Map" />
    <meta
      property="og:title"
      content="Find Your Closest NPR News Station: Interactive Coverage Map"
    />
    <meta
      property="og:description"
      content="Click anywhere on the US map to find the nearest NPR News member station, with FM broadcast coverage estimated from FCC transmitter data."
    />
    <meta property="og:url" content="https://nprmap.com/" />
    <meta property="og:image" content="https://nprmap.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Map of NPR News radio stations with broadcast coverage rings across the United States"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Find Your Closest NPR News Station: Interactive Coverage Map"
    />
    <meta
      name="twitter:description"
      content="Click anywhere on the US map to find the nearest NPR News member station, with FM broadcast coverage estimated from FCC transmitter data."
    />
    <meta name="twitter:image" content="https://nprmap.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Map of NPR News radio stations with broadcast coverage rings across the United States"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NPR News Station Map",
        "url": "https://nprmap.com/",
        "applicationCategory": "MapApplication",
        "operatingSystem": "Any",
        "description": "Interactive map for finding your closest NPR News member radio station. Broadcast coverage is estimated from FCC transmitter data (ERP, HAAT and station class). Music-only services are excluded.",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Find the nearest NPR News member station by map click or geolocation",
          "Search US cities and ZIP codes",
          "FM coverage bands estimated from FCC ERP/HAAT/class data",
          "Alternative receivable stations at your location"
        ],
        "audience": {
          "@type": "Audience",
          "audienceType": "Public radio listeners in the United States"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      Static fallback for crawlers and no-JS visitors. The app replaces
      this content when it mounts.
    -->
    <noscript>
      <main style="max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; color: #1c1917;">
        <h1>Find Your Closest NPR News Station</h1>
        <p>
          This is an interactive map of more than 900 NPR News member radio
          stations across the United States. Click anywhere on the map or
          share your location to find the nearest station carrying NPR News
          programming, along with alternative stations receivable at your
          location.
        </p>
        <p>
          Coverage rings approximate each station's broadcast range,
          estimated from FCC transmitter data; coverage may not be accurate.
        </p>
        <p>
          Only NPR News members are listed; music-only services (classical,
          jazz) are excluded.
        </p>
        <p><strong>This page requires JavaScript for the interactive map.</strong></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
